# ─────────────────────────────────────────────────────────────────────────────
#  Roblox Account Creator — Solvex edition
#  Any setting here can be overridden at runtime via CLI flags (see --help).
# ─────────────────────────────────────────────────────────────────────────────

[run]
# Number of parallel worker threads. Each thread runs one signup at a time.
threads = 32

# How many accounts to create. Set to 0 for infinite (Ctrl+C to stop).
count = 0

# Print full tracebacks on errors. Useful while debugging, noisy otherwise.
debug = false

# Single-line live status bar instead of the full per-event log.
compact = false

# Birthday for new accounts.
#   "auto"  → random age between 16 and 40
#   else    → ISO-8601 string, e.g. "2000-05-15T22:00:00.000Z"
birthday = "auto"

# Gender for new accounts.
#   "auto" → random (≈45% F, 45% M, 10% N/A)
#   1 = female, 2 = male, 3 = prefer-not-to-say
gender = "auto"

# Browser fingerprint to impersonate.
#   "auto"   → randomly pick per attempt
#   "safari" → Safari 18 on macOS
#   "chrome" → Chrome 146 on Windows
browser = "chrome"

# If a username is flagged AFTER a successful captcha (post-solve rename),
# retry with a fresh username on the same session instead of giving up.
# Costs an extra solve but recovers the attempt.
retry_on_failure = false


[solvex]
# Solvex API base URL. You normally do not need to change this.
url = "https://api.solvex.run"

# Your Solvex API key (starts with "sk_"). Required.
api_key = ""

# Max seconds to wait for a single captcha solve before giving up.
timeout_s = 120

# How often (seconds) to poll Solvex for solve completion.
poll_interval_s = 0.5

# Ask Solvex to also complete the proof-of-work challenge.
# Slower per solve, but needed when Roblox demands PoW (rare).
solve_pow = false

# Force HTTP/2 to the Solvex API instead of HTTP/3.
# Enable only if your network blocks QUIC/UDP.
disable_http3 = false


[proxy]
# Proxy strategy.
#   "pool"  → rotate through entries in `file`
#   "fixed" → use the single proxy in `url`
#   "none"  → direct connection (expect heavy 429 rate-limiting)
mode = "pool"

# Proxy list for mode = "pool". One per line. Accepted formats:
#   host:port
#   host:port:user:pass
#   user:pass@host:port
#   scheme://user:pass@host:port
file = "input/proxies.txt"

# Single proxy URL for mode = "fixed". Same formats as above.
url = ""


[output]
# Directory where result files are written (created if missing).
dir = "output"

# Successful signups appended as `username:password:cookies` (one per line).
accounts_file = "accounts.txt"

# Cookie strings only, one per line. Handy for importing into other tools.
cookies_file = "cookies.txt"
